[package]
name = "parseon-webhook-sink"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
parseon-core = { path = "../parseon-core" }
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.52", features = ["rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "time"] }
