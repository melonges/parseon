[package]
name = "parseon-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
parseon-core = { path = "../parseon-core" }
alloy = { version = "2.1", default-features = false, features = ["std", "dyn-abi"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
futures-util = "0.3"
mongodb = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
