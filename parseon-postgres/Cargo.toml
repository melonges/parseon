[package]
name = "parseon-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
parseon-core = { path = "../parseon-core" }
alloy = { version = "2.1", default-features = false, features = ["std", "dyn-abi"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono", "json", "bigdecimal"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
