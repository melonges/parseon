# Generated from https://chainlist.org/rpcs.json.
# Top N mainnet EVM chains by TVL with at least one HTTP/HTTPS RPC.
# Endpoints probed with eth_getBlockByNumber and ranked by chainlist.org's
# height-then-latency algorithm; failures dropped.
# Regenerate with: python3 scripts/gen_erpc.py --top 5 [--no-probe] [--filter-stale] [--src rpcs.json] [--dst erpc.yaml]

logLevel: warn

metrics:
  enabled: true
  port: 4001

database:
  evmJsonRpcCache:
    connectors:
      - id: memory
        driver: memory
    policies:
      - connector: memory
        finality: finalized

projects:
  - id: main
    upstreamDefaults:
      autoIgnoreUnsupportedMethods: true
      evm:
        # State-poller cadence for public RPCs; raise if you add many chains.
        statePollerInterval: 10m
      failsafe:
        - matchMethod: "*"
          timeout:
            duration: 30s
            quantile: 0.9
            minDuration: 1s
            maxDuration: 30s
          retry:
            maxAttempts: 3
            delay: 200ms
    networkDefaults:
      multiplexing: true
      evm:
        getLogsSplitOnError: true
        getLogsMaxAllowedRange: 10000
    networks:
      - architecture: evm
        evm:
          chainId: 1
        alias: eth
      - architecture: evm
        evm:
          chainId: 56
        alias: bnb
      - architecture: evm
        evm:
          chainId: 8453
        alias: base
      - architecture: evm
        evm:
          chainId: 42161
        alias: arb1
      - architecture: evm
        evm:
          chainId: 57073
        alias: ink
