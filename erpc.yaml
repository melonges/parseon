logLevel: info

server:
  httpHostV4: "0.0.0.0"
  httpPortV4: 4000
  maxTimeout: 50s

metrics:
  enabled: true
  hostV4: "0.0.0.0"
  port: 4001

database:
  evmJsonRpcCache:
    connectors:
      - id: hot
        driver: memory
    policies:
      - connector: hot
        finality: finalized
        empty: allow
      - connector: hot
        finality: unfinalized
        empty: allow
        ttl: 5s
      - connector: hot
        finality: realtime
        empty: allow
        ttl: 2s

projects:
  - id: main

    networks:
      - architecture: evm
        evm:
          chainId: 1
        failsafe:
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3
          hedge:
            delay: 1500ms
            maxCount: 1

      - architecture: evm
        evm:
          chainId: 42161
        failsafe:
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3
          hedge:
            delay: 1000ms
            maxCount: 1

      - architecture: evm
        evm:
          chainId: 10
        failsafe:
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3
          hedge:
            delay: 1500ms
            maxCount: 1

      - architecture: evm
        evm:
          chainId: 8453
        failsafe:
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3
          hedge:
            delay: 1500ms
            maxCount: 1

      - architecture: evm
        evm:
          chainId: 137
        failsafe:
          timeout:
            duration: 30s
          retry:
            maxAttempts: 3
          hedge:
            delay: 1500ms
            maxCount: 1

    upstreamDefaults:
      failsafe:
        - matchMethod: "*"
          retry:
            maxAttempts: 1
          circuitBreaker:
            failureThresholdCount: 20
            failureThresholdCapacity: 80
            halfOpenAfter: 5m
            successThresholdCount: 8

    upstreams:
      - id: public-eth
        endpoint: https://ethereum-rpc.publicnode.com
        evm:
          chainId: 1

      - id: public-arb
        endpoint: https://arbitrum-one.publicnode.com
        evm:
          chainId: 42161

      - id: public-op
        endpoint: https://optimism-rpc.publicnode.com
        evm:
          chainId: 10

      - id: public-base
        endpoint: https://base-rpc.publicnode.com
        evm:
          chainId: 8453

      - id: public-polygon
        endpoint: https://polygon-bor-rpc.publicnode.com
        evm:
          chainId: 137

rateLimiters:
  budgets:
    - id: global
      rules:
        - method: "*"
          maxCount: 10000
          period: 1s
